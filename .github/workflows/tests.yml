name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  locked-final-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-final.lock
      - name: Check dependencies and full synthetic suite
        run: |
          python -m pip check
          python -c "from src.runtime import require_reference_runtime; require_reference_runtime()"
          python -m pytest -q
